name: Publish pychd to PyPI

# Tag-driven release for the pychd workspace member (the decompiler
# itself). Tag schema: `pychd-vX.Y.Z`. The two sibling workflows
# (publish-pyfuzz.yaml, publish-pyobf.yaml) release their packages
# independently under `pyfuzz-v*` / `pyobf-v*` tags.

on:
  push:
    tags:
      - "pychd-v*"
  workflow_dispatch:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: extractions/setup-just@v2
      - run: uv sync --all-packages
      - run: just ci

  build:
    name: build wheel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --package pychd
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pychd
          path: dist/

  publish-pypi:
    name: publish → PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-pychd
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
