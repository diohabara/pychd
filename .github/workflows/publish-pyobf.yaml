name: Publish pychd-pyobf to PyPI

# Tag-driven release for the pychd-pyobf workspace member (.pyc
# identifier / constant / metadata anonymiser). Tag schema:
# `pyobf-vX.Y.Z`. Pushes to `main` trigger a dry-run release to
# TestPyPI; tag pushes release to real PyPI.

on:
  push:
    branches:
      - main
    tags:
      - "pyobf-v*"
  workflow_dispatch:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: extractions/setup-just@v2
      - run: uv sync --all-packages
      - run: just ci

  build:
    name: build wheel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --package pychd-pyobf
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pyobf
          path: dist/

  publish-testpypi:
    name: dry-run → TestPyPI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # ``continue-on-error: true`` keeps the workflow green for normal
    # development pushes when the TestPyPI side does not yet have a
    # Trusted Publisher registered for this workflow file. Once the
    # `testpypi` environment is wired up on TestPyPI (README §Releasing),
    # this dry-run will start exchanging tokens cleanly and you can
    # drop the flag if you want strict failure semantics on dry-runs.
    continue-on-error: true
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-pyobf
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish → PyPI
    if: startsWith(github.ref, 'refs/tags/pyobf-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-pyobf
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
