[project]
name = "pychd"
version = "1.2.0"
description = "Hybrid rule-based + LLM Python bytecode decompiler — native pass for 3.14 (99.8% signature recovery), cross-version pass for 3.0–3.13 via xdis"
readme = "README.md"
authors = [
    { name = "卍diohabara卍", email = "diohabara@users.noreply.github.com" }
]
dependencies = [
    "litellm>=1.30.0",
    "xdis>=6.1.0",
]
requires-python = ">= 3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pychd = "pychd.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty>=0.0.39",
    "prek",
    # Figure generation for the paper-quality benchmark section.
    # plotly is the renderer; kaleido is its static-image backend
    # (produces SVG / PNG without a browser).
    "plotly>=5.20",
    "kaleido==0.2.1",
    # Comparative benchmark targets — install on demand so the main
    # dev workflow stays fast. ``uncompyle6`` covers Python ≤ 3.8 and
    # ``decompyle3`` covers 3.7–3.8.
    "uncompyle6>=3.9.0",
    "decompyle3>=3.9.2",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["pychd", "pychd_pyfuzz", "pychd_pyobf", "tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pychd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's default `python_files` already includes both `test_*.py` and
# `*_test.py`. We standardise on the suffix form for this repo.
python_files = ["*_test.py", "test_*.py"]

[tool.uv.workspace]
# Two additional PyPI-publishable workspace members. See README §Releasing
# for the per-package tag scheme and Trusted Publishing setup.
members = ["pychd_pyfuzz", "pychd_pyobf"]

[tool.uv.sources]
# Make the workspace members resolvable to their editable in-tree
# checkouts, so `tools/eval_fuzz.py` can `import pychd_pyfuzz` /
# `import pychd_pyobf` without any extra install step. The root
# package `pychd` is also declared here because pychd-pyobf depends
# on it — without this, uv tries to resolve `pychd` from PyPI when
# building the workspace member.
pychd = { workspace = true }
pychd-pyfuzz = { workspace = true }
pychd-pyobf = { workspace = true }
